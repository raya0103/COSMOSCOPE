version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spherex-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DB_TYPE=sqlite
      - SQLITE_PATH=/app/data/spherex.db
      - FITS_CACHE_DIR=/app/data/cache/fits
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spherex-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
